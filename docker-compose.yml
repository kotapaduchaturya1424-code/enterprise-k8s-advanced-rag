version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: sre_admin
      POSTGRES_PASSWORD: sre_password
      POSTGRES_DB: k8s_metrics
    ports:
      - "5432:5432"